[project]
name = "agent-colosseum"
version = "0.1.0"
description = "Meta-agent that simulates multi-agent environments on Crusoe Cloud with Nvidia Nemotron"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2",
    "rich>=13",
    "streamlit>=1.28",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
colosseum = "colosseum.cli:main"
mind = "colosseum.mind_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
